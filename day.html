<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日刊</title>
  <meta name="description" content="日刊 · 当日">
  <meta name="color-scheme" content="only light">
  <meta name="theme-color" content="#F6F0E4">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    window.__rikanDate = new URLSearchParams(location.search).get("date") || "2026-08-21";
    window.__rikanThemeStart = "2026-08-22";
    window.__rikanWeek2Start = "2026-08-30";
    window.__rikanLegacy = /^\d{4}-\d{2}-\d{2}$/.test(window.__rikanDate)
      ? window.__rikanDate < window.__rikanThemeStart
      : true;
    document.documentElement.setAttribute("data-skin", window.__rikanLegacy ? "newspaper" : "v2");
    /* Fallback before JSON: 8.29 klein-etch; ≥8.30 ordered-dither; 8.22–8.28 klein-halftone. */
    if (!window.__rikanLegacy) {
      window.__rikanFallbackTheme =
        window.__rikanDate === "2026-08-29"
          ? "klein-etch"
          : (window.__rikanDate >= window.__rikanWeek2Start ? "ordered-dither" : "klein-halftone");
      document.documentElement.setAttribute("data-theme", window.__rikanFallbackTheme);
    }
  </script>
  <script>
    (function () {
      var legacy = window.__rikanLegacy;
      var fonts = legacy
        ? "https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Source+Serif+4:ital,wght@1,400;1,600&display=swap"
        : "https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;700;800;900&family=Inter+Tight:wght@800;900&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,600&display=swap";
      document.write('<link rel="stylesheet" href="' + fonts + '">');
      if (legacy) {
        document.write('<link rel="stylesheet" id="newspaper-css" href="css/style.css">');
      } else {
        document.write('<link rel="stylesheet" id="day-base-css" href="css/day-base.css">');
        document.write('<link rel="stylesheet" id="theme-css" href="css/themes/' +
          (window.__rikanFallbackTheme || "klein-halftone") + '.css">');
      }
    })();
  </script>
</head>
<body data-page="day">
  <a class="skip" href="#main">跳到正文</a>

  <div id="skin-newspaper">
    <div class="grain" aria-hidden="true"></div>
    <div class="page">
      <header class="masthead masthead--center">
        <h1 class="wordmark"><a href="index.html">日刊</a></h1>
        <div class="stamp" id="stamp" aria-label="日期邮票"></div>
      </header>
      <hr class="rule">
      <nav class="folio" id="folio"></nav>
      <main id="main">
        <div id="items"><p class="mute">载入中…</p></div>
      </main>
      <footer class="colophon">
        <hr class="rule">
        <p>日刊　开卷即读　不设登录</p>
      </footer>
    </div>
  </div>

  <div id="skin-v2" hidden>
    <canvas class="stipple-canvas" id="stipple" aria-hidden="true"></canvas>
    <div class="stipple-css" aria-hidden="true"></div>
    <div class="day">
      <div class="day-figure" aria-hidden="true"></div>
      <div class="iso-deco" aria-hidden="true">
        <span class="iso-tree"></span>
        <span class="iso-tree iso-tree--2"></span>
        <span class="iso-bench"></span>
        <span class="iso-stair"></span>
      </div>
      <header class="day-head">
        <p class="brand"><a href="index.html">日刊</a></p>
        <p class="day-kicker" id="day-kicker"></p>
        <h1 class="day-date" id="day-date"></h1>
        <p class="day-full" id="day-full"></p>
        <p class="day-count" id="day-count"></p>
        <p class="day-stub" id="day-stub" hidden>皮肤预览 · 条目复用 2026-08-21 真实稿件，非正式当日稿</p>
        <aside class="day-quote" id="day-quote"></aside>
      </header>
      <main id="main-v2">
        <ol class="items" id="items-v2"></ol>
      </main>
    </div>
  </div>

  <script src="js/stipple.js"></script>
  <script src="js/feel.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
